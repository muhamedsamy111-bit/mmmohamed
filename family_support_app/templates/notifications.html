{% extends "base.html" %}
{% block title %}الإشعارات{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="text-center mb-4">
    <h2 class="fw-bold text-dark"><i class="bi bi-bell me-2"></i>نظام الإشعارات والتنبيهات</h2>
    <p class="text-muted">الأسر التي لم تُزار منذ 30 يوم أو أكثر</p>
  </div>

  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span><i class="bi bi-exclamation-triangle me-2"></i>الأسر المحتاجة لزيارة</span>
      <span class="badge bg-danger rounded-pill" id="notifCount">...</span>
    </div>
    <div class="card-body p-0" id="notifList">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p>جاري تحميل الإشعارات...</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
fetch('/api/notifications')
  .then(r => r.json())
  .then(data => {
    document.getElementById('notifCount').textContent = data.count;
    const list = document.getElementById('notifList');

    if (data.count === 0) {
      list.innerHTML = `<div class="text-center py-5 text-success">
        <i class="bi bi-check-circle fs-1 mb-3 d-block"></i>
        <h5>ممتاز! كل الأسر تمت زيارتها خلال الـ 30 يوم الماضية</h5>
      </div>`;
      return;
    }

    let html = '<ul class="list-group list-group-flush">';
    data.notifications.forEach(n => {
      const isHigh = n.priority.includes('قصوى');
      const isMed  = n.priority.includes('متوسطة');
      const color  = isHigh ? 'danger' : isMed ? 'warning' : 'secondary';
      const icon   = isHigh ? 'bi-exclamation-octagon' : 'bi-clock-history';

      html += `<li class="list-group-item d-flex justify-content-between align-items-center py-3">
        <div class="d-flex align-items-center gap-3">
          <i class="bi ${icon} text-${color} fs-4"></i>
          <div>
            <div class="fw-bold">${n.family_name}</div>
            <small class="text-muted">${n.message}</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-${color}">${n.priority}</span>
          <a href="/followup/${n.family_index}" class="btn btn-sm btn-outline-primary rounded-pill">
            <i class="bi bi-calendar-plus me-1"></i>تسجيل زيارة
          </a>
        </div>
      </li>`;
    });
    html += '</ul>';
    list.innerHTML = html;
  });
</script>
{% endblock %}
