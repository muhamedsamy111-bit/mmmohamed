<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | بوابة دعم الأسر</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gov-blue: #003b6f; --gov-blue-light: #0a5ba6; --gov-gold: #c9a227; }
        * { font-family: 'Almarai', sans-serif; }
        body {
            background: linear-gradient(135deg, var(--gov-blue) 0%, var(--gov-blue-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .signup-card {
            background: #fff;
            border-radius: 14px;
            padding: 36px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }
        .signup-card h4 { color: var(--gov-blue); font-weight: 800; }
        .btn-gov { background: var(--gov-blue); color: #fff; font-weight: 700; }
        .btn-gov:hover { background: var(--gov-blue-light); color: #fff; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill" style="font-size:40px;color:var(--gov-blue)"></i>
            <h4 class="mt-2">إنشاء حساب جديد</h4>
            <p class="text-muted small">افتح حسابك عشان تقدر تقدّم على طلب دعم وتتابع حالته</p>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/signup">
            <div class="mb-3">
                <label class="form-label">الاسم الكامل</label>
                <input type="text" class="form-control" name="name" required placeholder="اكتب اسمك">
            </div>
            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" class="form-control" name="username" required placeholder="اسم مستخدم بالإنجليزي بدون مسافات">
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" name="password" required minlength="6" placeholder="6 حروف/أرقام على الأقل">
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-gov">إنشاء الحساب</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none small">عندك حساب بالفعل؟ سجّل الدخول</a>
        </div>
    </div>
</body>
</html>
