{% extends "base.html" %}
{% block title %}تغيير كلمة السر{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-key me-2"></i>تغيير كلمة السر</div>
        <div class="card-body">
          {% if error %}
          <div class="alert alert-danger rounded-3"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
          {% endif %}
          {% if success %}
          <div class="alert alert-success rounded-3"><i class="bi bi-check-circle me-2"></i>{{ success }}</div>
          {% endif %}

          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">كلمة السر القديمة</label>
              <input type="password" name="old_password" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">كلمة السر الجديدة</label>
              <input type="password" name="new_password" class="form-control" required>
              <small class="text-muted">لازم تكون 8 أحرف على الأقل، وتحتوي على حرف كبير ورقم</small>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">تأكيد كلمة السر الجديدة</label>
              <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check-circle me-2"></i>تغيير كلمة السر
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
